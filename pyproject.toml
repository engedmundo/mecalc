[project]
name = "mecalc"
version = "0.1.0"
description = "Calculadora técnica de engenharia mecânica, com memorial de cálculo e validação contra a literatura."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edmundo Abreu e Lima" }]
requires-python = ">=3.12"
keywords = ["engenharia mecânica", "engineering", "mechanical", "calculator"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pint>=0.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "plotly>=5.24", "alembic>=1.14"]
postgres = ["psycopg[binary]>=3.2"]

[project.urls]
Repository = "https://github.com/engedmundo/mecalc"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mecalc"]

# --- Ferramentas -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mecalc", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
pretty = true

# O mypy não entende decoradores aplicados sobre @property. No caso do
# @computed_field do Pydantic, a combinação é suportada e documentada.
disable_error_code = ["prop-decorator"]

# Regras mantidas
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Regras relaxadas
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

# Testes: funções de teste não precisam de anotação
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Bibliotecas sem tipagem completa
[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = "-ra --strict-markers --doctest-modules --import-mode=importlib"
